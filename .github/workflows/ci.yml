name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Daily automation: build + test the GUI library every night.
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ffi
          coverage: none
          tools: composer

      - name: Install X11 dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Build native libui3
        run: bash ext/build.sh

      - name: Make lib findable (Windows)
        if: runner.os == 'Windows'
        run: copy build\libui3.dll libui3.dll

      - name: Run Pest tests
        run: composer test

      - name: Run automation example (headless record-replay)
        run: composer automation

      - name: Run widget gallery example (headless)
        run: composer widgets

  # GTK4 backend (Linux) — native Wayland/X11-capable GTK4 build.
  test-gtk4:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ffi
          coverage: none
          tools: composer

      - name: Install GTK4 dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libcairo2-dev

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Build libui3 with GTK4 backend
        run: UI3_BACKEND=gtk4 bash ext/build.sh

      - name: Run headless smoke tests (gtk4 backend)
        run: |
          export UI3_BACKEND=gtk4
          PHPC_SKIP_GUI=1 php -d ffi.enable=true vendor/bin/pest --no-coverage \
            --filter="Clipboard|RichText|Compositor|WidgetsParity" 2>&1
